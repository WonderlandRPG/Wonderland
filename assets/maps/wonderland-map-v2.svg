<!-- Ashkara: dunas, cânions e vulcão -->
<g fill="none" stroke="#e6b36e" stroke-opacity=".28" stroke-width="3"><path d="M420 765c95-35 190-31 278 10"/><path d="M505 835c98-28 197-24 296 17"/><path d="M760 810c78-21 147-16 216 15"/></g>
