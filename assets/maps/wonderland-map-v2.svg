  <use href="#tree" x="990" y="478"/><use href="#tree" x="1042" y="500"/><use href="#tree" x="1095" y="472"/><use href="#tree" x="1152" y="510"/><use href="#tree" x="1210" y="485"/><use href="#tree" x="1265" y="518"/>
