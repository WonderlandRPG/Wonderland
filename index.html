<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wonderland RPG</title>

    <meta name="description" content="Onde toda história começa com uma escolha.">

    <link rel="icon" href="assets/images/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/home.css">

</head>

<body class="home-page">

    <!-- Fundo do templo -->
    <div class="home-background"></div>

    <!-- Partículas -->
    <div id="particles"></div>

    <!-- Camada de névoa -->
    <div class="mist-layer"></div>

    <!-- Música -->
    <audio id="bgMusic" loop preload="auto">
        <source src="assets/audio/wonderland.mp3" type="audio/mpeg">
    </audio>

    <!-- Conteúdo -->
    <main class="home-container">

        <img
            src="assets/images/logo.png"
            alt="Logo Wonderland"
            class="home-logo">

        <h1 class="home-title">
            WONDERLAND
        </h1>

        <p class="home-subtitle">
            Onde toda história começa com uma escolha.
        </p>

        <button
            id="enterButton"
            class="enter-button">

            ENTRAR

        </button>

    </main>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/home.js"></script>

</body>

</html>
