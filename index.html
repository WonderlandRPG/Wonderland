<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wonderland RPG</title>

    <meta
        name="description"
        content="Onde toda história começa com uma escolha."
    >

    <link
        rel="icon"
        type="image/png"
        href="assets/images/logo.png"
    >

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- Estilos -->
    <link rel="stylesheet" href="css/global.css?v=2">
    <link rel="stylesheet" href="css/home.css?v=2">
</head>

<body class="home-page">

    <!-- Cenário de fundo -->
    <div
        class="home-background"
        aria-hidden="true"
    ></div>

    <!-- Partículas -->
    <div
        id="particles"
        aria-hidden="true"
    ></div>

    <!-- Névoa -->
    <div
        class="mist-layer"
        aria-hidden="true"
    ></div>

    <!-- Trilha sonora -->
    <audio
        id="bgMusic"
        loop
        preload="auto"
    >
        <source
            src="assets/audio/wonderland.mp3"
            type="audio/mpeg"
        >

        Seu navegador não suporta reprodução de áudio.
    </audio>

    <!-- Conteúdo principal -->
    <main class="home-container">

        <img
            src="assets/images/logo.png"
            alt="Símbolo do RPG Wonderland"
            class="home-logo"
        >

        <h1 class="home-title">
            Wonderland
        </h1>

        <p class="home-subtitle">
            Onde toda história começa com uma escolha.
        </p>

        <button
            id="enterButton"
            class="enter-button"
            type="button"
        >
            Entrar
        </button>

    </main>

    <!-- Scripts -->
    <script src="js/app.js?v=2" defer></script>
    <script src="js/music.js?v=1" defer></script>
    <script src="js/home.js?v=2" defer></script>

</body>

</html>
