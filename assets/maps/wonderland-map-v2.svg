  <path d="M155 250c38-24 76-12 96 18-20 33-72 38-104 13z"/>
  <path d="M1445 410c34-22 70-9 86 21-22 28-61 30-88 8z"/>
  <path d="M1348 760c50-35 98-18 119 22-30 39-87 43-126 12z"/>
  <path d="M245 820c43-28 83-15 99 19-24 29-70 34-102 11z"/>
</g>

