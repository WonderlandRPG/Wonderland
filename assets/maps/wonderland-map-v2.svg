<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Mapa ilustrado de Wonderland</title>
<desc id="desc">Atlas fantástico de Wonderland com cinco reinos, Cidade Livre, mares, montanhas, florestas, rios, estradas, ruínas e territórios neutros.</desc>
<defs>
  <linearGradient id="ocean" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3f6870"/><stop offset=".52" stop-color="#244852"/><stop offset="1" stop-color="#122d36"/></linearGradient>
  <radialGradient id="oceanGlow" cx="48%" cy="40%" r="78%"><stop stop-color="#b8d4cf" stop-opacity=".18"/><stop offset="1" stop-color="#07191f" stop-opacity=".48"/></radialGradient>
  <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e1c48e"/><stop offset=".48" stop-color="#ae7d47"/><stop offset="1" stop-color="#5c341d"/></linearGradient>
  <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f0f5f4"/><stop offset=".58" stop-color="#b9c9ca"/><stop offset="1" stop-color="#71868a"/></linearGradient>
  <linearGradient id="west" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#76979a"/><stop offset="1" stop-color="#405f63"/></linearGradient>
  <linearGradient id="central" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b7c47b"/><stop offset="1" stop-color="#657743"/></linearGradient>
  <linearGradient id="east" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#759a68"/><stop offset="1" stop-color="#2d5038"/></linearGradient>
  <linearGradient id="south" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dfa05b"/><stop offset=".58" stop-color="#b46438"/><stop offset="1" stop-color="#6b2f1c"/></linearGradient>
  <linearGradient id="freecity" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c5a879"/><stop offset="1" stop-color="#806245"/></linearGradient>
  <pattern id="waves" width="54" height="30" patternUnits="userSpaceOnUse"><path d="M0 15Q13 4 27 15T54 15" fill="none" stroke="#d9ebe7" stroke-opacity=".11" stroke-width="1.6"/></pattern>
  <pattern id="grain" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="5" cy="7" r="1" fill="#2a2117" opacity=".08"/><circle cx="18" cy="17" r=".9" fill="#fff7df" opacity=".08"/></pattern>
  <filter id="landShadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#100905" flood-opacity=".58"/></filter>
  <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#140b06" flood-opacity=".5"/></filter>
  <filter id="fractureGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <g id="mountain"><path d="M0 42L26 0l26 42z" fill="#625645" stroke="#30271f" stroke-width="1.8"/><path d="M26 0l-9 16 9-5 8 8 8-5z" fill="#f2efe9"/><path d="M7 42l11-19 9 19z" fill="#40372e" opacity=".52"/></g>
  <g id="tree"><path d="M14 0L4 20h7L0 35h28l-10-15h8z" fill="#294c36" stroke="#173123" stroke-width="1.2"/><rect x="12" y="35" width="4" height="9" fill="#5a3d25"/></g>
  <g id="city"><rect x="4" y="15" width="40" height="24" rx="2" fill="#69523e" stroke="#2f231b" stroke-width="1.6"/><path d="M0 17L11 6l9 11 12-13 15 13" fill="#957951" stroke="#2f231b" stroke-width="1.6"/><rect x="20" y="26" width="8" height="13" fill="#2c2119"/><rect x="9" y="21" width="5" height="5" fill="#d5bb78"/></g>
  <g id="ruin"><path d="M0 42V8h8v34m10 0V0h8v42m10 0V15h8v27" fill="none" stroke="#493728" stroke-width="5"/><path d="M-6 42h58" stroke="#493728" stroke-width="5"/></g>
</defs>

<rect width="1600" height="1000" fill="#160d07"/>
<rect x="14" y="14" width="1572" height="972" rx="30" fill="url(#frame)" stroke="#3d2415" stroke-width="14"/>
<rect x="34" y="34" width="1532" height="932" rx="22" fill="#c3975f" opacity=".32"/>
<rect x="58" y="58" width="1484" height="884" rx="16" fill="url(#ocean)"/>
<rect x="58" y="58" width="1484" height="884" rx="16" fill="url(#oceanGlow)"/>
<rect x="58" y="58" width="1484" height="884" rx="16" fill="url(#waves)"/>

