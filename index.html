<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wonderland RPG</title>
    <meta name="description" content="Onde toda história começa com uma escolha.">
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/global.css?v=7">
    <link rel="stylesheet" href="css/home.css?v=7">
</head>
<body class="home-page">
    <div class="home-background" aria-hidden="true"></div><div class="home-background-light" aria-hidden="true"></div><div class="home-vignette" aria-hidden="true"></div><div class="mist-layer" aria-hidden="true"></div><div id="particles" aria-hidden="true"></div>
    <audio id="bgMusic" loop preload="auto"><source src="assets/audio/wonderland.mp3" type="audio/mpeg"></audio>
    <main class="home-shell"><section class="home-container" aria-labelledby="homeTitle"><p id="introQuote" class="intro-quote"></p><div class="home-logo-wrap" aria-hidden="true"><img src="assets/images/logo.png" alt="" class="home-logo"></div><span class="home-eyebrow">Arquivos do Primeiro Sonho</span><h1 id="homeTitle" class="home-title">Wonderland</h1><div class="home-divider" aria-hidden="true"><span></span><strong>◆</strong><span></span></div><p class="home-subtitle">Onde toda história começa com uma escolha.<span>Explore um mundo antigo, marcado por lendas, magia e destinos ainda não escritos.</span></p><button id="enterButton" class="enter-button" type="button">✦ Entrar em Wonderland ✦</button><div class="home-scroll-hint" aria-hidden="true"><span>O Primeiro Sonho aguarda</span><strong>⌄</strong></div></section></main>
    <script src="js/global-audio.js?v=2"></script><script src="js/engine/render.js"></script><script src="js/engine/theme.js"></script><script src="js/engine/effects.js"></script><script src="js/engine/search.js"></script><script src="js/engine/particles.js"></script><script src="js/engine/navigation.js"></script>
    <script>(()=>{const frases=["Todo sonho deixa marcas naquele que ousa despertá-lo.","Antes dos reinos existirem, existia apenas o Primeiro Sonho.","Nem toda criatura nasce... algumas apenas são lembradas.","A magia responde apenas àqueles que ousam buscá-la.","Wonderland observa cada escolha feita por seus aventureiros.","O impossível é apenas o primeiro desafio."];const body=document.body;const quote=document.getElementById("introQuote");const button=document.getElementById("enterButton");const music=document.getElementById("bgMusic");const background=document.querySelector(".home-background");quote.textContent=frases[Math.floor(Math.random()*frases.length)];Wonderland.Navigation.create();Wonderland.Particles.start();const reduceMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;if(!reduceMotion&&background){window.addEventListener("pointermove",event=>{const x=(event.clientX/window.innerWidth-.5)*10;const y=(event.clientY/window.innerHeight-.5)*8;background.style.translate=`${x}px ${y}px`},{passive:true})}button.addEventListener("click",()=>{if(button.disabled)return;button.disabled=true;body.classList.add("is-leaving");localStorage.setItem("wonderlandMusicEnabled","true");const savedVolume=Number(localStorage.getItem("wonderlandMusicVolume"));music.volume=Number.isFinite(savedVolume)?Math.min(Math.max(savedVolume,0),1):.25;music.muted=music.volume===0;music.play().catch(()=>{});window.setTimeout(()=>Wonderland.Navigation.start("menu.html"),reduceMotion?0:520)})})();</script>
</body></html>
