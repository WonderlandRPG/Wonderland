<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Wonderland RPG</title>

    <meta
        name="description"
        content="Onde toda história começa com uma escolha."
    >

    <link
        rel="icon"
        type="image/png"
        href="assets/images/logo.png"
    >

    <!-- Fontes -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/global.css?v=6"
    >

    <link
        rel="stylesheet"
        href="css/home.css?v=6"
    >

</head>

<body class="home-page">

    <!-- Fundo -->

    <div
        class="home-background"
        aria-hidden="true"
    ></div>

    <!-- Partículas -->

    <div
        id="particles"
        aria-hidden="true"
    ></div>

    <!-- Névoa -->

    <div
        class="mist-layer"
        aria-hidden="true"
    ></div>

    <!-- Música -->

    <audio
        id="bgMusic"
        loop
        preload="auto"
    >

        <source
            src="assets/audio/wonderland.mp3"
            type="audio/mpeg"
        >

    </audio>

    <!-- Conteúdo -->

    <main class="home-container">

        <p
            id="introQuote"
            class="intro-quote"
        >
        </p>

        <img
            src="assets/images/logo.png"
            alt="Símbolo do RPG Wonderland"
            class="home-logo"
        >

        <h1 class="home-title">

            Wonderland

        </h1>

        <p class="home-subtitle">

            Onde toda história começa com uma escolha.

        </p>

        <button
            id="enterButton"
            class="enter-button wl-button gold"
            type="button"
        >

            ✦ Entrar ✦

        </button>

    </main>

    <!-- Wonderland Engine -->

    <script src="js/engine/render.js"></script>
    <script src="js/engine/theme.js"></script>
    <script src="js/engine/effects.js"></script>
    <script src="js/engine/search.js"></script>
    <script src="js/engine/particles.js"></script>
    <script src="js/engine/navigation.js"></script>

    <!-- Página -->

    <script>

        const frases=[

            "Todo sonho deixa marcas naquele que ousa despertá-lo.",

            "Antes dos reinos existirem, existia apenas o Primeiro Sonho.",

            "Nem toda criatura nasce... algumas apenas são lembradas.",

            "A magia responde apenas àqueles que ousam buscá-la.",

            "Wonderland observa cada escolha feita por seus aventureiros.",

            "O impossível é apenas o primeiro desafio."

        ];

        const quote=document.getElementById("introQuote");

        quote.textContent=

            frases[Math.floor(Math.random()*frases.length)];

        Wonderland.Navigation.create();

        Wonderland.Particles.start();

        const music=

            document.getElementById("bgMusic");

        document

        .getElementById("enterButton")

        .onclick=()=>{

            localStorage.setItem(

                "wonderlandMusicEnabled",

                "true"

            );

            music.volume=.25;

            music.play().catch(()=>{});

            Wonderland.Navigation.start(

                "menu.html"

            );

        };

    </script>

</body>

</html>
