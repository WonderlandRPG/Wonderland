<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conta | Wonderland RPG</title>
  <meta name="description" content="Acesse sua conta e seus personagens de Wonderland.">
  <link rel="icon" type="image/png" href="assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/global.css?v=15">
  <link rel="stylesheet" href="css/components/buttons.css?v=1">
  <link rel="stylesheet" href="css/components/inputs.css?v=1">
  <link rel="stylesheet" href="css/account.css?v=1">
</head>
<body class="account-page">
  <div class="account-background" aria-hidden="true"></div>
  <div class="account-vignette" aria-hidden="true"></div>
  <div id="particles" aria-hidden="true"></div>

  <header class="account-topbar">
    <a href="menu.html" class="wl-button wl-button-ghost">← Menu</a>
    <a href="index.html" class="account-brand"><img src="assets/images/logo.png" alt=""><span>Wonderland</span></a>
  </header>

  <main class="account-shell">
    <section class="account-intro">
      <span class="account-eyebrow">Portal dos Aventureiros</span>
      <h1>Sua jornada começa aqui</h1>
      <p>Entre na sua conta ou crie um novo acesso para gerenciar personagens, fichas e inventários.</p>
    </section>

    <section class="account-panel">
      <div class="account-tabs" role="tablist" aria-label="Acesso à conta">
        <button class="account-tab active" type="button" data-account-tab="login">Entrar</button>
        <button class="account-tab" type="button" data-account-tab="register">Cadastrar</button>
      </div>

      <form id="loginForm" class="account-form active" data-account-panel="login" novalidate>
        <label class="account-field"><span>E-mail</span><input id="loginEmail" type="email" autocomplete="email" required placeholder="voce@exemplo.com"></label>
        <label class="account-field"><span>Senha</span><input id="loginPassword" type="password" autocomplete="current-password" required minlength="6" placeholder="Sua senha"></label>
        <p id="loginMessage" class="account-message" role="status"></p>
        <button class="wl-button wl-button-gold account-submit" type="submit">Entrar</button>
      </form>

      <form id="registerForm" class="account-form" data-account-panel="register" novalidate>
        <label class="account-field"><span>Nome de usuário</span><input id="registerName" type="text" autocomplete="nickname" required minlength="3" maxlength="24" placeholder="Como quer ser chamado"></label>
        <label class="account-field"><span>E-mail</span><input id="registerEmail" type="email" autocomplete="email" required placeholder="voce@exemplo.com"></label>
        <label class="account-field"><span>Senha</span><input id="registerPassword" type="password" autocomplete="new-password" required minlength="6" placeholder="Mínimo de 6 caracteres"></label>
        <label class="account-field"><span>Confirmar senha</span><input id="registerConfirm" type="password" autocomplete="new-password" required minlength="6" placeholder="Repita a senha"></label>
        <p id="registerMessage" class="account-message" role="status"></p>
        <button class="wl-button wl-button-green account-submit" type="submit">Criar conta</button>
      </form>

      <aside class="account-prototype-note">
        <strong>Conta protegida</strong>
        <p>Login, sessões e personagens agora são armazenados com segurança no Supabase.</p>
      </aside>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js?v=1"></script>
  <script src="js/account-store.js?v=4"></script>
  <script src="js/pages/account.js?v=3" defer></script>
</body>
</html>
