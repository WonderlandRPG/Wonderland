<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>História | Wonderland RPG</title>

    <meta
        name="description"
        content="Conheça as eras e os mistérios da história de Wonderland."
    >

    <link
        rel="icon"
        type="image/png"
        href="assets/images/logo.png"
    >

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- Estilos -->
    <link rel="stylesheet" href="css/global.css?v=8">
    <link rel="stylesheet" href="css/historia.css?v=2">
</head>

<body class="history-page">

    <!-- Cenário -->
    <div
        class="history-background"
        aria-hidden="true"
    ></div>

    <!-- Partículas -->
    <div
        id="particles"
        aria-hidden="true"
    ></div>

    <!-- Névoa -->
    <div
        class="mist-layer"
        aria-hidden="true"
    ></div>

    <!-- Música -->
    <audio
        id="bgMusic"
        loop
        preload="auto"
    >
        <source
            src="assets/audio/wonderland.mp3"
            type="audio/mpeg"
        >
    </audio>

    <!-- Botão de música -->
    <button
        id="musicButton"
        class="history-music-button"
        type="button"
        aria-label="Tocar música"
        title="Tocar música"
    >
        <span id="musicIcon">♪</span>
    </button>

    <!-- Voltar -->
    <a
        href="menu.html"
        class="history-return"
    >
        ← Menu
    </a>

    <!-- Cabeçalho -->
    <header class="history-header">

        <img
            src="assets/images/logo.png"
            alt="Símbolo do RPG Wonderland"
            class="history-logo"
        >

        <span class="history-label">
            Arquivos do Primeiro Sonho
        </span>

        <h1>
            História de Wonderland
        </h1>

        <p>
            Explore as eras que moldaram o mundo e descubra os acontecimentos
            que deram origem às lendas.
        </p>

    </header>

    <!-- Conteúdo -->
    <main class="history-layout">

        <aside
            class="history-timeline"
            aria-label="Eras de Wonderland"
        >

            <button
                class="era-button active"
                type="button"
                data-file="primeiro-sonho.html"
            >
                Primeiro Sonho
            </button>

            <button
                class="era-button"
                type="button"
                data-file="colossos.html"
            >
                Era dos Colossos
            </button>

            <button
                class="era-button"
                type="button"
                data-file="dragoes.html"
            >
                Era dos Dragões
            </button>

            <button
                class="era-button"
                type="button"
                data-file="coroas.html"
            >
                Era das Coroas
            </button>

            <button
                class="era-button"
                type="button"
                data-file="cinzas.html"
            >
                Era das Cinzas
            </button>

            <button
                class="era-button"
                type="button"
                data-file="fraturas.html"
            >
                Era das Fraturas
            </button>

            <button
                class="era-button"
                type="button"
                data-file="era-atual.html"
            >
                Era Atual
            </button>

        </aside>

        <section
            class="history-book"
            aria-live="polite"
        >

            <div id="bookContent">
                <p class="history-loading">
                    Carregando os registros...
                </p>
            </div>

        </section>

    </main>

    <script src="js/historia.js?v=1" defer></script>

</body>

</html>
