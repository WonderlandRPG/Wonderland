<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
<title id="t">Mapa vetorial de Wonderland</title>
<desc id="d">Mapa interativo em SVG com regiões, cidades, florestas, montanhas, rios e terras neutras.</desc>
<defs>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#d9c18f"/><stop offset="1" stop-color="#9c7445"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#496d72"/><stop offset="1" stop-color="#223b43"/>
  </linearGradient>
  <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#d9e5e6"/><stop offset="1" stop-color="#879ea1"/>
  </linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#8ca35e"/><stop offset="1" stop-color="#50643d"/>
  </linearGradient>
  <linearGradient id="forest" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#6f9258"/><stop offset="1" stop-color="#31513b"/>
  </linearGradient>
  <linearGradient id="desert" x1="0" y1="0" x2="0" y2="1">
    <stop stop-color="#c78b4d"/><stop offset="1" stop-color="#88492b"/>
  </linearGradient>
  <pattern id="waves" width="36" height="20" patternUnits="userSpaceOnUse">
    <path d="M0 10Q9 2 18 10T36 10" fill="none" stroke="#c7dbd7" stroke-opacity=".18"/>
  </pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1d1208" flood-opacity=".45"/>
  </filter>
  <g id="m">
    <path d="M0 28L18 0l18 28z" fill="#665641" stroke="#342a20" stroke-width="1.5"/>
    <path d="M18 0l-5 10 5-3 5 6 5-3z" fill="#f0ece3"/>
  </g>
  <g id="tr">
    <path d="M12 0L3 16h6L0 28h24l-9-12h6z" fill="#31543b" stroke="#203729"/>
    <rect x="10" y="28" width="4" height="8" fill="#5b4027"/>
  </g>
  <g id="ct">
    <rect x="2" y="10" width="30" height="18" rx="2" fill="#65523d" stroke="#30261c" stroke-width="1.5"/>
    <path d="M0 12L8 4l8 8 8-9 10 9" fill="#8a704f" stroke="#30261c" stroke-width="1.5"/>
    <rect x="14" y="18" width="6" height="10" fill="#30261c"/>
  </g>
</defs>

<rect width="1600" height="1000" fill="#24170d"/>
<rect x="20" y="20" width="1560" height="960" rx="22" fill="url(#paper)" stroke="#6b4725" stroke-width="10"/>
<rect x="58" y="58" width="1484" height="884" rx="12" fill="url(#sea)"/>
<rect x="58" y="58" width="1484" height="884" rx="12" fill="url(#waves)"/>

<!-- CONTINENTE -->
<path id="continent" d="M520 95C680 58 820 82 930 150c110 68 190 125 305 205 100 70 145 165 100 270-50 115-160 190-290 245-140 58-300 76-440 36-140-40-250-110-315-205-70-105-62-215-12-315 58-118 135-230 242-291z" fill="#7c8050" stroke="#40331f" stroke-width="6" filter="url(#shadow)"/>

<!-- REGIÕES -->
<path id="region-vinterhold" data-region="vinterhold" d="M340 88H1080v250c-125 25-220-3-325-12-125-10-215 30-305-8-65-28-95-122-110-230z" fill="url(#snow)" stroke="#4d5b5e" stroke-width="4"/>
<path id="region-valdor" data-region="valdor" d="M260 300c100-55 190-20 250 65 55 75 30 155 3 230-35 95-80 168-145 195-70-55-120-135-135-230-16-105-5-195 27-260z" fill="#55747a" stroke="#3f5559" stroke-width="4"/>
<path id="region-aurelia" data-region="aurelia" d="M500 320c115-35 245-28 345 30 90 53 145 155 120 260-25 100-120 155-230 145-115-10-200-65-230-155-27-84-35-195-5-280z" fill="url(#green)" stroke="#4a5834" stroke-width="4"/>
<path id="region-eldoria" data-region="eldoria" d="M835 295c145-30 285 12 410 95 85 58 115 155 70 245-50 100-145 150-280 175-55-58-85-125-95-190-18-100-5-195-105-325z" fill="url(#forest)" stroke="#2e4b35" stroke-width="4"/>
<path id="region-ashkara" data-region="ashkara" d="M365 680c110-35 220-5 330 60 110 65 230 83 350 55-42 85-150 135-285 145-145 8-270-32-360-105-55-45-75-105-35-155z" fill="url(#desert)" stroke="#704020" stroke-width="4"/>
<path id="city-elysium" data-region="elysium" d="M450 515c42-35 90-35 130-10 42 28 47 75 18 110-33 42-95 50-135 18-40-30-43-82-13-118z" fill="#9b8260" stroke="#5e4936" stroke-width="4"/>

<!-- RIOS -->
<g fill="none" stroke="#c1dbd7" stroke-opacity=".7" stroke-width="5">
  <path d="M760 185c-40 110 0 155-35 245-32 80-5 125-40 210-28 68-15 125-48 205"/>
  <path d="M1035 330c-55 65-18 120-75 185-40 45-25 95-65 145"/>
  <path d="M450 350c50 38 72 88 48 140"/>
</g>

<!-- ESTRADAS -->
<g fill="none" stroke="#4e3b28" stroke-opacity=".58" stroke-width="4" stroke-dasharray="10 8">
  <path d="M760 255c-55 100-55 210-35 330 15 90-12 175-35 245"/>
  <path d="M330 520c135 15 255 40 395 70 185 40 350-20 485-90"/>
  <path d="M480 555c55 18 95 30 135 45"/>
</g>

<!-- MONTANHAS DO NORTE -->
<g opacity=".96">
  <use href="#m" x="470" y="115"/><use href="#m" x="530" y="100" transform="scale(1.2)"/>
  <use href="#m" x="615" y="135"/><use href="#m" x="690" y="92" transform="scale(1.15)"/>
  <use href="#m" x="770" y="130"/><use href="#m" x="855" y="108"/>
</g>

<!-- CORDILHEIRA DOS COLOSSOS -->
<g id="neutral-colossus-range" data-neutral="cordilheira-colossos">
  <use href="#m" x="970" y="255" transform="scale(1.35)"/>
  <use href="#m" x="1030" y="300" transform="scale(1.1)"/>
  <use href="#m" x="1080" y="245" transform="scale(1.45)"/>
  <use href="#m" x="1145" y="315"/>
</g>

<!-- FLORESTAS -->
<g id="neutral-ancient-forest" data-neutral="floresta-antiga">
  <use href="#tr" x="310" y="365" transform="scale(1.25)"/>
  <use href="#tr" x="355" y="390" transform="scale(1.1)"/>
  <use href="#tr" x="335" y="435"/><use href="#tr" x="390" y="425"/>
</g>
<g id="eldoria-forest">
  <use href="#tr" x="1025" y="410"/><use href="#tr" x="1075" y="430"/><use href="#tr" x="1125" y="405"/>
  <use href="#tr" x="1175" y="445"/><use href="#tr" x="1010" y="490"/><use href="#tr" x="1090" y="510"/>
  <use href="#tr" x="1160" y="520"/><use href="#tr" x="1230" y="485"/><use href="#tr" x="1050" y="565"/>
  <use href="#tr" x="1125" y="585"/><use href="#tr" x="1200" y="565"/>
</g>

<!-- CIDADES -->
<g opacity=".98">
  <use href="#ct" x="730" y="515" transform="scale(1.9)"/>
  <use href="#ct" x="325" y="560" transform="scale(1.5)"/>
  <use href="#ct" x="1120" y="530" transform="scale(1.45)"/>
  <use href="#ct" x="720" y="220" transform="scale(1.35)"/>
  <use href="#ct" x="690" y="820" transform="scale(1.45)"/>
  <use href="#ct" x="505" y="555" transform="scale(1.15)"/>
</g>

<!-- VULCÃO -->
<g id="ashkara-volcano" transform="translate(760 745)">
  <path d="M0 75L50 0l100 75z" fill="#6d4229" stroke="#3f281c" stroke-width="3"/>
  <path d="M38 18c12-10 25-10 36 0-12 10-24 10-36 0z" fill="#df642f"/>
  <path d="M51 16c-4-14 5-20 10-32 8 12 4 24 0 32" fill="#ffb548"/>
</g>

<!-- FRATURAS -->
<g id="neutral-fractures" data-neutral="fraturas" fill="none">
  <path d="M1115 705l-12 18 12 13-18 25 14 20" stroke="#9f4fd0" stroke-width="5"/>
  <path d="M1115 736l20-15m-38 40l-18-8m32 28l20-14" stroke="#c276ee" stroke-width="3"/>
  <path d="M1185 730l-8 12 8 10-13 18 10 14" stroke="#9f4fd0" stroke-width="4"/>
</g>

<!-- RUÍNAS DE ASTERION -->
<g id="neutral-ruins-asterion" data-neutral="ruinas-asterion" stroke="#5a4631" stroke-width="5" fill="none">
  <path d="M1035 850v-30h8v30m8 0v-42h8v42m8 0v-26h8v26"/>
  <path d="M1028 850h56"/>
</g>

<!-- TERRAS SELVAGENS -->
<path id="neutral-wildlands" data-neutral="terras-selvagens" d="M260 395c55-48 112-48 165-8-42 95-55 180-115 242-55-52-83-145-50-234z" fill="#5e7041" fill-opacity=".15" stroke="#415233" stroke-width="3" stroke-dasharray="10 8"/>

<!-- MAR DA NÉVOA -->
<g id="neutral-mist-sea" data-neutral="mar-nevoa">
  <ellipse cx="1370" cy="230" rx="115" ry="68" fill="#d6e2df" fill-opacity=".12"/>
  <path d="M1285 230c45-45 130-45 175 0-45 45-130 45-175 0z" fill="none" stroke="#d6e2df" stroke-opacity=".35" stroke-width="3"/>
  <path d="M1330 230c28-25 60-22 82 0-22 22-54 25-82 0z" fill="none" stroke="#d6e2df" stroke-opacity=".35" stroke-width="2"/>
</g>

<!-- ILHAS -->
<g fill="#747950" stroke="#403421" stroke-width="3">
  <path d="M180 245c40-20 75-5 90 25-25 25-65 30-95 10z"/>
  <path d="M1450 420c30-25 60-10 75 20-30 25-60 20-80 0z"/>
  <path d="M1360 760c45-30 90-15 110 20-25 35-75 40-110 10z"/>
  <path d="M270 805c40-25 75-10 90 20-25 25-60 30-85 10z"/>
</g>

<rect x="58" y="58" width="1484" height="884" rx="12" fill="none" stroke="#b18b54" stroke-width="4"/>
</svg>