<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">Mapa ilustrado de Wonderland</title>
<desc id="desc">Atlas de fantasia com cinco reinos, cidade livre, mares, montanhas, florestas, rios, estradas e territórios neutros.</desc>
<defs>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#335a64"/><stop offset="1" stop-color="#18343c"/></linearGradient>
  <radialGradient id="seaLight" cx="50%" cy="42%" r="75%"><stop stop-color="#87a8a5" stop-opacity=".18"/><stop offset="1" stop-color="#0d2027" stop-opacity=".35"/></radialGradient>
  <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e7eff0"/><stop offset=".55" stop-color="#b8c9cc"/><stop offset="1" stop-color="#718b90"/></linearGradient>
  <linearGradient id="valdor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#73969a"/><stop offset="1" stop-color="#3f6065"/></linearGradient>
  <linearGradient id="aurelia" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a5b86e"/><stop offset="1" stop-color="#627641"/></linearGradient>
  <linearGradient id="eldoria" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#719463"/><stop offset="1" stop-color="#31513a"/></linearGradient>
  <linearGradient id="ashkara" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d99a57"/><stop offset=".6" stop-color="#ac6337"/><stop offset="1" stop-color="#6e321c"/></linearGradient>
  <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d7bd87"/><stop offset="1" stop-color="#81552e"/></linearGradient>
  <pattern id="waves" width="42" height="24" patternUnits="userSpaceOnUse"><path d="M0 12Q10 4 21 12T42 12" fill="none" stroke="#dce9e5" stroke-opacity=".12" stroke-width="1.4"/></pattern>
  <pattern id="terrainDots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="4" cy="5" r="1.2" fill="#20170f" opacity=".09"/><circle cx="14" cy="12" r=".8" fill="#fff7dc" opacity=".08"/></pattern>
  <filter id="landShadow" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#120b06" flood-opacity=".56"/></filter>
  <filter id="symbolShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#160d07" flood-opacity=".48"/></filter>
  <filter id="fractureGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <g id="mountain"><path d="M0 38L24 0l24 38z" fill="#665948" stroke="#372d24" stroke-width="1.6"/><path d="M24 0l-8 14 8-5 7 8 8-5z" fill="#f0ede6"/><path d="M7 38l10-17 8 17z" fill="#463d32" opacity=".5"/></g>
  <g id="hill"><path d="M0 25Q18 0 36 25z" fill="#667548" stroke="#3f4b31" stroke-width="1.2"/></g>
  <g id="tree"><path d="M13 0L3 18h7L0 32h26l-9-14h7z" fill="#294e37" stroke="#173224" stroke-width="1.2"/><rect x="11" y="32" width="4" height="8" fill="#5d3e25"/></g>
  <g id="pine"><path d="M12 0L4 14h5L1 26h22l-7-12h5z" fill="#365941" stroke="#203b2c" stroke-width="1.1"/><rect x="10" y="26" width="4" height="7" fill="#5b4028"/></g>
  <g id="city"><rect x="3" y="14" width="38" height="22" rx="2" fill="#67513e" stroke="#2f231b" stroke-width="1.5"/><path d="M0 16L10 6l9 10 11-12 14 12" fill="#927651" stroke="#2f231b" stroke-width="1.5"/><rect x="18" y="24" width="8" height="12" fill="#2b2119"/><rect x="8" y="20" width="5" height="5" fill="#d8bd77"/></g>
  <g id="tower"><rect x="7" y="12" width="24" height="30" fill="#65503e" stroke="#2f231b" stroke-width="1.5"/><path d="M4 13L19 0l15 13z" fill="#8b704e" stroke="#2f231b" stroke-width="1.5"/><rect x="16" y="29" width="6" height="13" fill="#2d2118"/></g>
</defs>

<rect width="1600" height="1000" fill="#1c1109"/>
<rect x="18" y="18" width="1564" height="964" rx="26" fill="url(#parchment)" stroke="#59381e" stroke-width="12"/>
<rect x="40" y="40" width="1520" height="920" rx="18" fill="#b48955" opacity=".28"/>
<rect x="60" y="60" width="1480" height="880" rx="14" fill="url(#sea)"/>
<rect x="60" y="60" width="1480" height="880" rx="14" fill="url(#seaLight)"/>
<rect x="60" y="60" width="1480" height="880" rx="14" fill="url(#waves)"/>

