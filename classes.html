<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Classes | Wonderland RPG</title>

    <meta
        name="description"
        content="Conheça todas as classes de Wonderland."
    >

    <link
        rel="icon"
        type="image/png"
        href="assets/images/logo.png"
    >

    <!-- Fontes -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="css/global.css?v=14"
    >

    <link
        rel="stylesheet"
        href="css/classes.css?v=1"
    >

</head>

<body class="classes-page">

    <!-- Fundo -->

    <div class="classes-background"></div>

    <div
        id="particles"
        class="particles"
    ></div>

    <div class="mist-layer"></div>

    <!-- Música -->

    <audio
        id="bgMusic"
        loop
        preload="auto"
    >

        <source
            src="assets/audio/wonderland.mp3"
            type="audio/mpeg"
        >

    </audio>

    <!-- Botão Música -->

    <button
        id="musicButton"
        class="music-button"
        type="button"
    >

        <span id="musicIcon">
            ♪
        </span>

    </button>

    <!-- Voltar -->

    <a
        href="menu.html"
        class="return-button"
    >

        ← Menu

    </a>

    <!-- Hero -->

    <header class="classes-hero">

        <img
            src="assets/images/logo.png"
            class="classes-logo"
            alt="Wonderland"
        >

        <span class="hero-label">
            Caminhos do Primeiro Sonho
        </span>

        <h1>
            Classes
        </h1>

        <p>

            Escolha o estilo de combate que melhor representa
            sua jornada em Wonderland.

        </p>

    </header>

    <!-- Conteúdo -->

    <main class="classes-layout">

        <!-- Lista -->

        <aside class="classes-sidebar">

            <div id="classesList">

                <!-- JS -->

            </div>

        </aside>

        <!-- Painel -->

        <section class="class-panel">

            <div id="classContent">

                <!-- JS -->

            </div>

        </section>

    </main>

    <script src="js/classes-data.js?v=1"></script>

    <script src="js/classes.js?v=1"></script>

</body>

</html>
