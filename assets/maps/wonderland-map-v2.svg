<!-- texturas internas -->
<g opacity=".2"><path d="M337 110c124-46 276-54 420-34 119 17 233 35 343 9l27 273c-125 15-231-3-347-11-134-10-236 28-331-8-70-27-104-101-112-229z" fill="url(#terrainDots)"/><path d="M237 305c78-72 176-73 254-5 73 64 86 157 52 254-37 106-83 201-165 255-88-47-147-129-166-235-20-113-7-211 25-269z" fill="url(#terrainDots)"/><path d="M455 316c116-53 260-55 375-4 109 48 183 151 169 266-14 116-100 200-226 219-129 20-248-31-302-135-49-95-56-241-16-346z" fill="url(#terrainDots)"/><path d="M798 304c145-54 311-40 446 45 113 71 175 183 138 299-39 122-149 199-302 230-68-57-110-136-123-224-18-119 10-226-159-350z" fill="url(#terrainDots)"/><path d="M336 683c119-56 250-37 377 33 121 67 253 84 394 45-32 105-146 184-296 204-160 21-314-17-420-101-75-59-103-130-55-181z" fill="url(#terrainDots)"/></g>

<!-- rios e lagos -->
<g fill="none" stroke="#d6e7e4" stroke-linecap="round">
